# Docker-Compose-Grundgerüst für das Nebenkostenabrechnungs-Portal (Phase 1).
#
# Der Service "mysql" ist optional: In Produktion kann MySQL 8 auch extern
# gehostet werden (z.B. Managed Database). In diesem Fall den Service
# entfernen bzw. nicht starten und DATABASE_URL in .env auf den externen
# Host zeigen lassen.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Führt die DB-basierte Job-Queue aus (siehe src/lib/queue). Eigener
    # Worker-Einstiegspunkt wird ergänzt, sobald asynchrone Jobs existieren.
    command: node worker.js
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped

  # Optional: kann entfallen, wenn MySQL 8 extern/managed betrieben wird.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nebenkostenki
      MYSQL_USER: nebenkostenki
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
